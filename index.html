<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>TYT UVL-15W · 写频工具</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">UV</div>
      <div class="brand-text">
        <strong>UVL-15W</strong>
        <span>写频工具</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btnSerial" class="btn btn-accent">USB</button>
      <button id="btnBle" class="btn btn-accent">BLE</button>
      <button id="btnDisconnect" class="btn" disabled>断开</button>
      <span class="topbar-vr"></span>
      <button id="btnRead" class="btn" disabled>读取</button>
      <button id="btnWriteAll" class="btn btn-danger" disabled>写入</button>
      <span class="status" id="status">未连接</span>
    </div>
  </header>

  <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="dev-bar" id="devBar"></div>

  <!-- 标签 -->
  <nav class="tabbar">
    <button class="tab active" data-tab="ch">信道</button>
    <button class="tab" data-tab="vfo">频率模式</button>
    <button class="tab" data-tab="dev">设备</button>
    <button class="tab" data-tab="log">日志</button>
    <button class="tab" data-tab="set">设置</button>
  </nav>

  <main class="content">

    <!-- ================= 信道 ================= -->
    <section class="page active" id="page-ch">
      <div class="ch-layout">

        <div class="ch-list">
          <div class="toolbar">
            <button id="btnChRead" class="btn" disabled>读取</button>
            <button id="btnChWrite" class="btn btn-danger" disabled>写入</button>
            <span class="toolbar-vr"></span>
            <button id="btnChSelectAll" class="btn btn-ghost">全选</button>
            <button id="btnChSelectNone" class="btn btn-ghost">清除选择</button>
            <button id="btnChBatch" class="btn btn-ghost" disabled>批量</button>
            <span class="toolbar-vr"></span>
            <button id="btnCsvExport" class="btn btn-ghost">导出</button>
            <button id="btnCsvImport" class="btn btn-ghost">导入</button>
            <span class="toolbar-vr"></span>
            <button id="btnChCopy" class="btn btn-ghost">复制</button>
            <button id="btnChPaste" class="btn btn-ghost" disabled>粘贴</button>
            <button id="btnChMoveUp" class="btn btn-ghost" disabled>上移</button>
            <button id="btnChMoveDown" class="btn btn-ghost" disabled>下移</button>
            <button id="btnChClear" class="btn btn-ghost btn-ghost-danger" disabled>清空</button>
          </div>

          <div class="table-wrap">
            <table class="ch-table">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" id="chCheckAll"></th>
                  <th class="col-ch">CH</th>
                  <th class="col-name">名称</th>
                  <th class="col-freq">接收</th>
                  <th class="col-freq">发射</th>
                  <th class="col-dup">差频</th>
                  <th class="col-tone">编码</th>
                  <th class="col-tone">解码</th>
                  <th class="col-pow">功率</th>
                  <th class="col-bw">带宽</th>
                  <th class="col-scan">扫描</th>
                  <th class="col-flag">状态</th>
                </tr>
              </thead>
              <tbody id="chTbody"></tbody>
            </table>
          </div>
        </div>

        <aside class="edit-pane" id="chEditPanel">
          <div class="empty-edit">
            <div class="empty-icon">◎</div>
            <p>选中任一信道开始编辑</p>
          </div>

          <div id="chEditForm" style="display:none;">
            <div class="edit-head">
              <button id="btnChBack" class="btn btn-ghost btn-sm mobile-only" aria-label="返回列表">←</button>
              <h3 id="chEditTitle">编辑</h3>
              <button id="btnChRevert" class="btn btn-ghost btn-sm">撤销</button>
            </div>

            <div class="form-row cols-2">
              <div class="field"><label>接收频率 (MHz)</label><input id="f_rx" inputmode="decimal" placeholder="145.525"></div>
              <div class="field"><label>发射频率 (MHz)</label><input id="f_tx" inputmode="decimal" placeholder="145.525"></div>
            </div>
            <p class="hint">填写 RX/TX 后自动推导差频；只填一个则自动补齐。</p>

            <div class="form-row cols-2">
              <div class="field"><label>差频模式</label>
                <select id="f_dupMode" disabled>
                  <option value="0">关闭</option><option value="1">负差频</option>
                  <option value="2">正差频</option><option value="3">收发分离</option>
                </select>
              </div>
              <div class="field"><label>差频频率</label><input id="f_dupFreq" readonly></div>
            </div>

            <div class="field"><label>信道名</label><input id="f_name" maxlength="24" placeholder="≤ 24 字节"></div>

            <div class="form-row cols-2">
              <div class="field"><label>编码类型</label>
                <select id="f_encType"><option value="0">关闭</option><option value="1">模拟</option><option value="2">数字</option></select>
              </div>
              <div class="field"><label>编码值</label><select id="f_encIndex"></select></div>
            </div>

            <div class="form-row cols-2">
              <div class="field"><label>解码类型</label>
                <select id="f_decType">
                  <option value="0">关闭</option><option value="1">模拟</option><option value="2">数字</option>
                  <option value="3">模拟反向</option><option value="4">数字反向</option>
                </select>
              </div>
              <div class="field"><label>解码值</label><select id="f_decIndex"></select></div>
            </div>

            <div class="form-row cols-3">
              <div class="field"><label>功率</label>
                <select id="f_power"><option value="0">低</option><option value="1">中</option><option value="2">高</option></select>
              </div>
              <div class="field"><label>带宽</label>
                <select id="f_bw"><option value="0">宽</option><option value="1">窄</option></select>
              </div>
              <div class="field"><label>仅收</label>
                <select id="f_rxOnly"><option value="0">否</option><option value="1">是</option></select>
              </div>
            </div>

            <div class="form-row cols-2">
              <div class="field"><label>扫描</label>
                <select id="f_scan">
                  <option value="0">参与</option><option value="1">跳过</option>
                  <option value="2">优先</option><option value="3">保留</option>
                </select>
              </div>
              <div class="field"><label>步进</label>
                <select id="f_step">
                  <option value="0">2.5k</option><option value="1">3.125k</option><option value="2">5k</option>
                  <option value="3">6.25k</option><option value="4">8.33k</option><option value="5">10k</option>
                  <option value="6">12.5k</option><option value="7">15k</option><option value="8">20k</option>
                  <option value="9">25k</option><option value="10">50k</option><option value="11">100k</option>
                </select>
              </div>
            </div>

            <div class="form-actions">
              <button id="btnChApply" class="btn btn-accent flex-1">应用</button>
              <button id="btnChApplyNext" class="btn flex-1">应用并下一条</button>
            </div>
          </div>
        </aside>

      </div>
    </section>

    <!-- ================= VFO ================= -->
    <section class="page" id="page-vfo">
      <div class="page-head">
        <div>
          <h2>频率模式</h2>
          <p>VFO A / B 及临时中继快捷区</p>
        </div>
        <div class="page-actions">
          <button id="btnVfoRead" class="btn" disabled>读取 VFO</button>
          <button id="btnVfoWrite" class="btn btn-danger" disabled>写入 VFO</button>
        </div>
      </div>

      <div class="vfo-grid">

        <div class="card">
          <div class="card-head">
            <span class="badge badge-a">A</span>
            <span class="card-addr">0x13B80</span>
          </div>
          <div class="form-row cols-2">
            <div class="field"><label>接收频率 (MHz)</label><input id="va_rx" inputmode="decimal" placeholder="430.000"></div>
            <div class="field"><label>发射频率 (MHz)</label><input id="va_tx" inputmode="decimal" placeholder="430.000"></div>
          </div>
          <p class="hint">RX/TX 自动推导差频</p>
          <div class="form-row cols-2">
            <div class="field"><label>差频模式</label>
              <select id="va_dupMode" disabled>
                <option value="0">关闭</option><option value="1">负差频</option>
                <option value="2">正差频</option><option value="3">收发分离</option>
              </select>
            </div>
            <div class="field"><label>差频频率</label><input id="va_dupFreq" readonly></div>
          </div>
          <div class="form-row cols-2">
            <div class="field"><label>编码类型</label>
              <select id="va_encType"><option value="0">关闭</option><option value="1">模拟</option><option value="2">数字</option></select>
            </div>
            <div class="field"><label>编码值</label><select id="va_encIndex"></select></div>
          </div>
          <div class="form-row cols-2">
            <div class="field"><label>解码类型</label>
              <select id="va_decType">
                <option value="0">关闭</option><option value="1">模拟</option><option value="2">数字</option>
                <option value="3">模拟反向</option><option value="4">数字反向</option>
              </select>
            </div>
            <div class="field"><label>解码值</label><select id="va_decIndex"></select></div>
          </div>
          <div class="form-row cols-3">
            <div class="field"><label>功率</label>
              <select id="va_power"><option value="0">低</option><option value="1">中</option><option value="2">高</option></select>
            </div>
            <div class="field"><label>带宽</label>
              <select id="va_bw"><option value="0">宽</option><option value="1">窄</option></select>
            </div>
            <div class="field"><label>步进</label>
              <select id="va_step">
                <option value="0">2.5k</option><option value="1">3.125k</option><option value="2">5k</option>
                <option value="3">6.25k</option><option value="4">8.33k</option><option value="5">10k</option>
                <option value="6">12.5k</option><option value="7">15k</option><option value="8">20k</option>
                <option value="9">25k</option><option value="10">50k</option><option value="11">100k</option>
              </select>
            </div>
          </div>
          <div class="form-actions">
            <button id="btnVfoAClear" class="btn btn-ghost btn-ghost-danger flex-1">清空 VFO A</button>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <span class="badge badge-b">B</span>
            <span class="card-addr">0x13BB0</span>
          </div>
          <div class="form-row cols-2">
            <div class="field"><label>接收频率 (MHz)</label><input id="vb_rx" inputmode="decimal" placeholder="430.000"></div>
            <div class="field"><label>发射频率 (MHz)</label><input id="vb_tx" inputmode="decimal" placeholder="430.000"></div>
          </div>
          <p class="hint">RX/TX 自动推导差频</p>
          <div class="form-row cols-2">
            <div class="field"><label>差频模式</label>
              <select id="vb_dupMode" disabled>
                <option value="0">关闭</option><option value="1">负差频</option>
                <option value="2">正差频</option><option value="3">收发分离</option>
              </select>
            </div>
            <div class="field"><label>差频频率</label><input id="vb_dupFreq" readonly></div>
          </div>
          <div class="form-row cols-2">
            <div class="field"><label>编码类型</label>
              <select id="vb_encType"><option value="0">关闭</option><option value="1">模拟</option><option value="2">数字</option></select>
            </div>
            <div class="field"><label>编码值</label><select id="vb_encIndex"></select></div>
          </div>
          <div class="form-row cols-2">
            <div class="field"><label>解码类型</label>
              <select id="vb_decType">
                <option value="0">关闭</option><option value="1">模拟</option><option value="2">数字</option>
                <option value="3">模拟反向</option><option value="4">数字反向</option>
              </select>
            </div>
            <div class="field"><label>解码值</label><select id="vb_decIndex"></select></div>
          </div>
          <div class="form-row cols-3">
            <div class="field"><label>功率</label>
              <select id="vb_power"><option value="0">低</option><option value="1">中</option><option value="2">高</option></select>
            </div>
            <div class="field"><label>带宽</label>
              <select id="vb_bw"><option value="0">宽</option><option value="1">窄</option></select>
            </div>
            <div class="field"><label>步进</label>
              <select id="vb_step">
                <option value="0">2.5k</option><option value="1">3.125k</option><option value="2">5k</option>
                <option value="3">6.25k</option><option value="4">8.33k</option><option value="5">10k</option>
                <option value="6">12.5k</option><option value="7">15k</option><option value="8">20k</option>
                <option value="9">25k</option><option value="10">50k</option><option value="11">100k</option>
              </select>
            </div>
          </div>
          <div class="form-actions">
            <button id="btnVfoBClear" class="btn btn-ghost btn-ghost-danger flex-1">清空 VFO B</button>
          </div>
        </div>

      </div>

      <div class="card rpt-card">
        <div class="card-head">
          <span class="card-title">临时中继快捷区</span>
        </div>
        <div class="form-row cols-3">
          <div class="field"><label>下行频率 (MHz)</label><input id="rpt_rx" inputmode="decimal" placeholder="145.000"></div>
          <div class="field"><label>上行频率 (MHz)</label><input id="rpt_tx" inputmode="decimal" placeholder="145.600"></div>
          <div class="field"><label>亚音类型</label>
            <select id="rpt_toneType">
              <option value="0">关闭</option><option value="1">模拟 CTCSS</option><option value="2">数字 DTCS</option>
            </select>
          </div>
        </div>
        <div class="form-row cols-2">
          <div class="field"><label>亚音值</label><select id="rpt_toneValue"></select></div>
          <div class="field"><label>目标 VFO</label>
            <select id="rpt_target"><option value="A">VFO A</option><option value="B">VFO B</option></select>
          </div>
        </div>
        <div class="form-actions">
          <button id="btnRptApply" class="btn btn-accent flex-1">填入目标 VFO</button>
          <button id="btnRptSaveMem" class="btn flex-1">保存记忆</button>
          <button id="btnRptClear" class="btn btn-ghost flex-1">清除</button>
        </div>

        <div class="mem-block">
          <div class="mem-head">
            <span>本地记忆</span>
            <button id="btnRptClearMem" class="btn btn-ghost btn-sm">清空记忆</button>
          </div>
          <div class="mem-list" id="rptMemList">
            <div class="mem-empty">暂无记忆</div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 设备 ================= -->
    <section class="page" id="page-dev">
      <div class="card dev-card">
        <div class="card-head">
          <span class="card-title">设备信息</span>
          <button id="btnDevRefresh" class="btn btn-sm" disabled>重新读取</button>
        </div>
        <div class="dev-info-body" id="devInfoBody">连接后自动获取，或点击“重新读取”</div>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-title">密码校验</span></div>
        <div class="form-row cols-2">
          <div class="field"><label>密码类型</label>
            <select id="pwdType"><option value="0">读频密码</option><option value="1">写频密码</option></select>
          </div>
          <div class="field"><label>密码（≤ 8 字节）</label><input id="pwdValue" maxlength="8" placeholder="12345678"></div>
        </div>
        <div class="form-actions">
          <button id="btnPwdCheck" class="btn" disabled>校验</button>
        </div>
        <div id="pwdResult" class="pwd-result"></div>
      </div>
    </section>

    <!-- ================= 日志 ================= -->
    <section class="page" id="page-log">
      <div class="toolbar">
        <button id="btnLogClear" class="btn btn-ghost">清空日志</button>
        <button id="btnLogScrollToggle" class="btn btn-ghost">自动滚动：开</button>
      </div>
      <div class="log-box" id="logBox"></div>
    </section>

    <!-- ================= 设置 ================= -->
    <section class="page" id="page-set">
      <div class="card">
        <div class="settings-list">

          <div class="setting-row">
            <div class="setting-label">帧日志</div>
            <label class="checkbox"><input type="checkbox" id="setVerbose" checked> 记录每条 TX / RX 完整帧</label>
          </div>

          <div class="setting-row">
            <div class="setting-label">失败重试</div>
            <input id="setRetry" type="number" min="0" max="3" value="1">
          </div>

          <div class="setting-row">
            <div class="setting-label">读写块大小</div>
            <input id="setBlockSize" type="number" min="16" max="128" value="64">
          </div>

          <div class="setting-row">
            <div class="setting-label">保持会话</div>
            <label class="checkbox"><input type="checkbox" id="setKeepSession"> 读取后不重启设备（需固件支持）</label>
          </div>

          <div class="setting-row">
            <div class="setting-label">BLE Service</div>
            <input id="setBleService" value="00000001-ba2a-46c9-ae49-01b0961f68bb">
          </div>

          <div class="setting-row">
            <div class="setting-label">BLE Write</div>
            <input id="setBleWrite" value="00000002-ba2a-46c9-ae49-01b0961f68bb">
          </div>

          <div class="setting-row">
            <div class="setting-label">BLE Notify</div>
            <input id="setBleNotify" value="00000003-ba2a-46c9-ae49-01b0961f68bb">
          </div>

        </div>
        <div class="form-actions">
          <button id="btnSaveLocal" class="btn btn-accent">保存到浏览器</button>
          <button id="btnLoadLocal" class="btn">从浏览器加载</button>
          <button id="btnExportJson" class="btn">导出 JSON</button>
          <button id="btnImportJson" class="btn">导入 JSON</button>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- 确认弹窗 -->
<div class="modal" id="modalConfirm">
  <div class="modal-box">
    <h3 id="mConfirmTitle">确认</h3>
    <div id="mConfirmBody" class="modal-body"></div>
    <div class="modal-actions">
      <button id="mConfirmCancel" class="btn">取消</button>
      <button id="mConfirmOk" class="btn btn-accent">确认</button>
    </div>
  </div>
</div>

<!-- 批量修改弹窗 -->
<div class="modal" id="modalBatch">
  <div class="modal-box">
    <h3>批量修改</h3>
    <div class="form-row cols-3">
      <div class="field"><label>功率</label>
        <select id="b_power"><option value="">不修改</option><option value="0">低</option><option value="1">中</option><option value="2">高</option></select>
      </div>
      <div class="field"><label>带宽</label>
        <select id="b_bw"><option value="">不修改</option><option value="0">宽</option><option value="1">窄</option></select>
      </div>
      <div class="field"><label>仅收</label>
        <select id="b_rxOnly"><option value="">不修改</option><option value="0">否</option><option value="1">是</option></select>
      </div>
    </div>
    <div class="form-row cols-2">
      <div class="field"><label>编码类型</label>
        <select id="b_encType"><option value="">不修改</option><option value="0">关闭</option><option value="1">模拟</option><option value="2">数字</option></select>
      </div>
      <div class="field"><label>编码值</label><select id="b_encIndex"><option value="">不修改</option></select></div>
    </div>
    <div class="form-row cols-2">
      <div class="field"><label>解码类型</label>
        <select id="b_decType"><option value="">不修改</option><option value="0">关闭</option><option value="1">模拟</option><option value="2">数字</option><option value="3">模拟反向</option><option value="4">数字反向</option></select>
      </div>
      <div class="field"><label>解码值</label><select id="b_decIndex"><option value="">不修改</option></select></div>
    </div>
    <div class="field"><label>扫描</label>
      <select id="b_scan"><option value="">不修改</option><option value="0">参与</option><option value="1">跳过</option><option value="2">优先</option><option value="3">保留</option></select>
    </div>
    <div class="modal-actions">
      <button id="mBatchCancel" class="btn">取消</button>
      <button id="mBatchOk" class="btn btn-accent">应用</button>
    </div>
  </div>
</div>

<script src="js/protocol.js"></script>
<script src="js/state.js"></script>
<script src="js/log.js"></script>
<script src="js/modal.js"></script>
<script src="js/connection.js"></script>
<script src="js/session.js"></script>
<script src="js/ui-channel.js"></script>
<script src="js/ui-vfo.js"></script>
<script src="js/ui-device.js"></script>
<script src="js/ui-settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
